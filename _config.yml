# Site settings. Jekyll does not reload this file under `jekyll serve`;
# restart the server after editing it.

locale                   : "en-US"
title                    : "Chenjie Qiu"
title_separator          : "-"
name                     : "Chenjie Qiu"
description              : "Chenjie Qiu is a research assistant at Singapore Management University working on language agents, retrieval, and interpretability."
url                      : https://yausankit.github.io
baseurl                  : ""
repository               : "yausankit/yausankit.github.io"

author:
  name                   : "Chenjie Qiu"
  email                  : "yausankit@gmail.com"
  googlescholar          : "https://scholar.google.com/citations?view_op=list_works&hl=en&user=GVTNC_kAAAAJ"
  github                 : "yausankit"

# Social profiles, emitted as the schema.org Person `sameAs` list in seo.html.
social:
  type                   : # Person (default) or Organization
  name                   : # defaults to `name`
  links                  : # list of profile URLs

# Social media preview defaults
og_image                 : # file name under /images/
og_description           :

# Analytics: "false", "google-analytics-4" (set tracking_id) or "custom"
# (put the script in _includes/analytics-providers/custom.html).
analytics:
  provider               : "false"
  google:
    tracking_id          :

include:
  - _pages

exclude:
  - .sass-cache
  - design-concepts
  - Gemfile
  - LICENSE
  - local
  - README.md
  - vendor

markdown                 : kramdown
kramdown:
  input                  : GFM
  hard_wrap              : false
  auto_ids               : true
  entity_output          : as_char
  smart_quotes           : lsquo,rsquo,ldquo,rdquo

future                   : true
timezone                 : Etc/UTC

collections:
  publications:
    output               : false

defaults:
  - scope:
      path               : ""
      type               : pages
    values:
      layout             : home

sass:
  sass_dir               : _sass
  style                  : compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings              : all
  ignore:
    envs                 : development
